[build-system]
requires = ["setuptools>=42"]
build-backend = "setuptools.build_meta"

[project]
name = "protocolcity-worklane"
version = "0.1.7"
description = "Local-first work queue for multi-agent teams — claims, lanes, and verified closeouts over SQLite"
requires-python = ">=3.9"
dependencies = [
    "fastapi>=0.95",
    "uvicorn[standard]>=0.20",
]

[project.scripts]
worklane = "worklane.server:main"
worklane-mcp = "worklane.mcp.server:main"
wl = "worklane.cli.wl:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["worklane*"]

[tool.setuptools.package-data]
# wl-230: surfaces assets must ship — task_server.py reads desk-scene.css/.js
# at import time; a wheel without them dies with FileNotFoundError.
worklane = [
    "py.typed",
    "static/fonts/*",
    "surfaces/desk/*.css",
    "surfaces/desk/*.js",
]
