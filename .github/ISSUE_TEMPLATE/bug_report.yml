name: Bug report
description: Something broke or behaved unexpectedly
labels: ["bug"]
body:
  - type: input
    id: version
    attributes:
      label: WorkLane version
      description: The release tag you're running (e.g. v0.1.0) — from `pip show worklane` or the tag you cloned.
      placeholder: v0.1.0
    validations:
      required: true
  - type: textarea
    id: what
    attributes:
      label: What happened?
      description: What did you do, what did you expect, and what happened instead? Server logs or CLI/MCP output welcome.
    validations:
      required: true
  - type: textarea
    id: setup
    attributes:
      label: Agent setup
      description: Which clients touch your queue (MCP host, `wl` CLI, raw HTTP)? How many agents run concurrently?
    validations:
      required: false
